<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agende seu horário</title>
<style>
:root{--bg:#FAF6F2;--surf:#FFFDFB;--line:#EFE4DD;--ink:#3B2E2E;--muted:#756560;--rose:#A45F5C;--rose-d:#8F504D;--blush:#F3E1DC;--gold:#7F6538;--sage:#E6EFE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font:italic 500 40px/1.05 Georgia,'Times New Roman',serif;margin:0}
h2{font:600 24px/1.15 Georgia,serif;margin:0 0 12px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}.sm{font-size:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:8px;cursor:pointer;font:inherit;color:inherit}
.opt:hover{border-color:#D9B9B2}.opt.on{background:var(--blush);border-color:#D9A9A2}
.opt b{font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.day{flex:none;width:62px;height:72px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit;color:inherit}
.day span{font-size:11px;letter-spacing:.1em;color:var(--muted)}.day b{font:600 24px Georgia,serif}
.day.on{background:var(--blush);border-color:#D9A9A2}.day[disabled]{opacity:.35;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:inherit}
.slot.on{background:var(--rose);border-color:var(--rose);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;height:48px;border:1px solid #E5D6CE;border-radius:14px;padding:0 14px;font:inherit;background:#fff;color:var(--ink)}
textarea{height:84px;padding:12px 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;border:0;background:var(--rose);color:#fff;font:600 16px inherit;cursor:pointer;margin-top:18px;text-decoration:none}
.btn:hover{background:var(--rose-d)}.btn[disabled]{opacity:.5}
.btn.wa{background:#1F7A4D}.btn.ghost{background:transparent;color:#7A4543;border:1px solid #D9B9B2}
.err{background:#FBECEA;color:#9A3A36;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
.ok{text-align:center;padding:12px 0}
.hp{position:absolute;left:-9999px}
.steps{display:flex;gap:6px;margin:18px 0 0}.steps i{flex:1;height:4px;border-radius:2px;background:#E9DDD6}.steps i.on{background:var(--rose)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="muted" style="padding:60px 0;text-align:center">Carregando…</div></div>
<script>
var API = 'https://jygogsopwktsrcklfzta.supabase.co/functions/v1/glow';
var DIAS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'], MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var Q = new URLSearchParams(location.search), SLUG = Q.get('e') || '';
var cat = null, st = { svc: '', pro: 'any', date: '', time: '' }, app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mins(t){ var p = t.split(':'); return +p[0] * 60 + +p[1]; }
function hhmm(m){ return ('0'+Math.floor(m/60)).slice(-2) + ':' + ('0'+(m%60)).slice(-2); }
function pad(n){ return ('0'+n).slice(-2); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function brl(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function call(body){ return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
function svc(){ return cat.services.filter(function(s){return s.k===st.svc;})[0]; }
function overlap(a,b){ return a[0] < b[1] && b[0] < a[1]; }
function dayList(){
  var out = [], d = new Date(); d.setHours(12,0,0,0);
  for (var i = 0; i <= (cat.advance||60) && out.length < 45; i++) { var x = new Date(d); x.setDate(d.getDate()+i); out.push(x); }
  return out;
}
function slotsFor(date){
  var s = svc(), h = cat.hours, out = [], d = new Date(date + 'T12:00:00'); if (h.days.indexOf(d.getDay()) < 0) return out;
  var pros = st.pro === 'any' ? cat.pros.map(function(p){return p.id;}) : [st.pro], busy = cat.busy[date] || {}, now = new Date(), isToday = date === iso(now), nowM = now.getHours()*60 + now.getMinutes() + (cat.minHours||0)*60;
  var lunch = h.lunchFrom && h.lunchTo ? [mins(h.lunchFrom), mins(h.lunchTo)] : null;
  for (var m = mins(h.open); m + s.dur <= mins(h.close); m += (h.step||30)) {
    if (isToday && m < nowM) continue; var iv = [m, m + s.dur];
    if (lunch && overlap(iv, lunch)) continue;
    if (pros.some(function(p){ return !(busy[p]||[]).some(function(b){ return overlap(iv,b); }); })) out.push(hhmm(m));
  }
  return out;
}
function head(){ return '<div class="eyebrow">Agendamento online</div><h1>' + esc(cat.studio.name) + '</h1>' + (cat.studio.owner ? '<div class="muted">com ' + esc(cat.studio.owner) + '</div>' : ''); }
function render(){
  var s = svc(), h = head();
  h += '<div class="steps"><i class="on"></i><i class="' + (st.svc ? 'on' : '') + '"></i><i class="' + (st.date && st.time ? 'on' : '') + '"></i></div>';
  h += '<div class="card"><h2>1. Escolha o procedimento</h2>' + cat.services.map(function(x){ return '<button class="opt ' + (x.k===st.svc?'on':'') + '" data-svc="' + x.k + '"><span><b>' + esc(x.name) + '</b><br><span class="muted sm">' + x.dur + ' min</span></span><b>' + (x.price ? brl(x.price) : '') + '</b></button>'; }).join('') + '</div>';
  if (st.svc) {
    if (cat.pros.length > 1) h += '<div class="card"><h2>Com quem?</h2><button class="opt ' + (st.pro==='any'?'on':'') + '" data-pro="any"><b>Sem preferência</b></button>' + cat.pros.map(function(p){ return '<button class="opt ' + (st.pro===p.id?'on':'') + '" data-pro="' + p.id + '"><b>' + esc(p.name) + '</b></button>'; }).join('') + '</div>';
    h += '<div class="card"><h2>2. Escolha o dia e o horário</h2><div class="days">' + dayList().map(function(d){ var k = iso(d), n = slotsFor(k).length; return '<button class="day ' + (k===st.date?'on':'') + '" data-date="' + k + '"' + (n ? '' : ' disabled') + '><span>' + DIAS[d.getDay()] + '</span><b>' + d.getDate() + '</b><span>' + MES[d.getMonth()] + '</span></button>'; }).join('') + '</div>';
    if (st.date) { var sl = slotsFor(st.date); h += '<div class="slots">' + (sl.length ? sl.map(function(t){ return '<button class="slot ' + (t===st.time?'on':'') + '" data-time="' + t + '">' + t + '</button>'; }).join('') : '<span class="muted">Sem horários neste dia.</span>') + '</div>'; }
    h += '</div>';
  }
  if (st.svc && st.date && st.time) {
    h += '<div class="card"><h2>3. Seus dados</h2><label for="nm">Seu nome</label><input id="nm" autocomplete="name" maxlength="80"><label for="ph">WhatsApp com DDD</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 9 0000-0000"><label for="nt">Observação (opcional)</label><textarea id="nt" maxlength="300" placeholder="Ex.: primeira vez, alergia, referência de arte…"></textarea><input class="hp" id="site" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="err"></div><button class="btn" id="go">Solicitar horário</button><div class="muted sm" style="margin-top:10px;text-align:center">Seu pedido fica pendente até o estúdio confirmar pelo WhatsApp.</div></div>';
  }
  app.innerHTML = h;
  var q = function(sel, fn){ [].forEach.call(app.querySelectorAll(sel), function(el){ el.onclick = function(){ fn(el); }; }); };
  q('[data-svc]', function(el){ st.svc = el.dataset.svc; st.date = ''; st.time = ''; render(); });
  q('[data-pro]', function(el){ st.pro = el.dataset.pro; st.date = ''; st.time = ''; render(); });
  q('[data-date]', function(el){ st.date = el.dataset.date; st.time = ''; render(); });
  q('[data-time]', function(el){ st.time = el.dataset.time; render(); setTimeout(function(){ var n = document.getElementById('nm'); if (n) n.scrollIntoView({behavior:'smooth',block:'center'}); }, 50); });
  var go = document.getElementById('go'); if (go) go.onclick = send;
}
function send(){
  var go = document.getElementById('go'), err = document.getElementById('err'); err.innerHTML = ''; go.disabled = true; go.textContent = 'Enviando…';
  call({ action:'book', slug:SLUG, service:st.svc, proId:st.pro, date:st.date, time:st.time, name:document.getElementById('nm').value, phone:document.getElementById('ph').value, note:document.getElementById('nt').value, site:document.getElementById('site').value })
  .then(function(r){
    if (!r.ok) { err.innerHTML = '<div class="err">' + esc(r.error || 'Não foi possível enviar.') + '</div>'; go.disabled = false; go.textContent = 'Solicitar horário'; if (/ocupado/.test(r.error||'')) reload(); return; }
    var s = svc(), d = new Date(st.date + 'T12:00:00'), when = DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) + ' às ' + st.time;
    var msg = 'Oi! Acabei de pedir um horário pelo site: ' + s.name + ', ' + when + '. Meu nome é ' + document.getElementById('nm').value + '.';
    var wa = (cat.studio.whats || '').replace(/\D/g, ''); if (wa && wa.length <= 11) wa = '55' + wa;
    app.innerHTML = head() + '<div class="card ok"><div style="font-size:44px">💗</div><h2>Pedido enviado!</h2><p>' + esc(s.name) + '<br><b>' + when + '</b></p><p class="muted">Assim que o estúdio confirmar, você recebe uma mensagem no WhatsApp.</p>' + (wa ? '<a class="btn wa" href="https://wa.me/' + wa + '?text=' + encodeURIComponent(msg) + '">Avisar pelo WhatsApp</a>' : '') + '<button class="btn ghost" onclick="location.reload()">Fazer outro pedido</button></div>';
  }).catch(function(){ err.innerHTML = '<div class="err">Sem conexão. Tente novamente.</div>'; go.disabled = false; go.textContent = 'Solicitar horário'; });
}
function reload(){ call({ action:'public_catalog', slug:SLUG }).then(function(r){ if (r.ok) { cat = r.catalog; st.time = ''; render(); } }); }
if (!SLUG) app.innerHTML = '<div class="card"><h2>Link incompleto</h2><p class="muted">Peça o link de agendamento ao estúdio.</p></div>';
else call({ action:'public_catalog', slug:SLUG }).then(function(r){ if (!r.ok) throw 0; cat = r.catalog; document.title = 'Agende · ' + cat.studio.name; render(); }).catch(function(){ app.innerHTML = '<div class="card"><h2>Agendamento indisponível</h2><p class="muted">Este link não está ativo no momento. Fale com o estúdio pelo WhatsApp.</p></div>'; });
</script>
</body>
</html>
