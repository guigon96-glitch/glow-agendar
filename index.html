<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agende seu horário</title>
<style>
:root{--bg:#FAF6F2;--surf:#FFFDFB;--line:#EFE4DD;--ink:#3B2E2E;--muted:#756560;--rose:#A45F5C;--rose-d:#8F504D;--blush:#F3E1DC;--gold:#7F6538;--sage:#E6EFE6;--line2:#E5D6CE;--field:#fff;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font:italic 500 40px/1.05 Georgia,'Times New Roman',serif;margin:0}
h2{font:600 24px/1.15 Georgia,serif;margin:0 0 12px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}.sm{font-size:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--field);margin-top:8px;cursor:pointer;font:inherit;color:inherit}
.opt:hover{border-color:var(--line2)}.opt.on{background:var(--blush);border-color:var(--line2)}
.opt b{font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.day{flex:none;width:62px;height:72px;border:1px solid var(--line);border-radius:16px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit;color:inherit}
.day span{font-size:11px;letter-spacing:.1em;color:var(--muted)}.day b{font:600 24px Georgia,serif}
.day.on{background:var(--blush);border-color:var(--line2)}.day[disabled]{opacity:.35;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--field);cursor:pointer;font:inherit;color:inherit}
.slot.on{background:var(--rose);border-color:var(--rose);color:var(--on)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;height:48px;border:1px solid var(--line2);border-radius:14px;padding:0 14px;font:inherit;background:var(--field);color:var(--ink)}
textarea{height:84px;padding:12px 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;border:0;background:var(--rose);color:var(--on);font:600 16px inherit;cursor:pointer;margin-top:18px;text-decoration:none}
.btn:hover{background:var(--rose-d)}.btn[disabled]{opacity:.5}
.btn.wa{background:#1F7A4D;color:#fff}.btn.ghost{background:transparent;color:var(--rose-d);border:1px solid var(--line2)}
.err{background:var(--blush);color:#9A3A36;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
.ok{text-align:center;padding:12px 0}
.hp{position:absolute;left:-9999px}
.pix{text-align:center}.pix svg{max-width:240px;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}.code{font:12px/1.35 ui-monospace,Menlo,monospace;background:var(--blush);border-radius:12px;padding:10px;word-break:break-all;text-align:left;max-height:90px;overflow:auto}
.tabs{display:flex;gap:8px;margin-top:16px}.tabs button{flex:1;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--field);font:inherit;color:inherit;cursor:pointer}.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.item{border-top:1px solid var(--line);padding:14px 0}.item:first-of-type{border-top:0;padding-top:4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blush);color:var(--rose-d);white-space:nowrap}.pill.off{background:var(--line);color:var(--muted)}.pill.ok{background:var(--sage);color:#2F6B45}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:120px;height:44px;margin-top:10px;font-size:15px}
.star{color:var(--gold);letter-spacing:1px}.stars{display:flex;gap:4px}.stars button{font-size:30px;line-height:1;background:none;border:0;padding:4px;cursor:pointer;color:var(--line2)}.stars button.on{color:var(--gold)}
.rev{border-top:1px solid var(--line);padding:12px 0}.rev:first-of-type{border-top:0}
.steps{display:flex;gap:6px;margin:18px 0 0}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line2)}.steps i.on{background:var(--rose)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="muted" style="padding:60px 0;text-align:center">Carregando…</div></div>

    return '';
  }
  function payload(o) {
    var acct = tlv('00', 'br.gov.bcb.pix') + tlv('01', o.key);
    var p = tlv('00', '01') + tlv('01', '12') + tlv('26', acct) + tlv('52', '0000') + tlv('53', '986');
    if (o.amount > 0) p += tlv('54', Number(o.amount).toFixed(2));
    p += tlv('58', 'BR') + tlv('59', clean(o.name, 25) || 'RECEBEDOR') + tlv('60', clean(o.city, 15) || 'BRASIL');
    p += tlv('62', tlv('05', String(o.txid || '***').replace(/[^A-Za-z0-9*]/g, '').slice(0, 25) || '***'));

  }
  return { crc16: crc16, normKey: normKey, payload: payload, qrSvg: qrSvg, clean: clean };
})();

<script>

  var out = [], d = new Date(); d.setHours(12,0,0,0);

function tabs(){ return (mem().list || []).length ? '<div class="tabs"><button class="' + (view==='book'?'on':'') + '" data-view="book">Agendar</button><button class="' + (view==='mine'?'on':'') + '" data-view="mine">Meus horários</button></div>' : ''; }

function send(){

  }).catch(function(){ err.innerHTML = '<div class="err">Sem conexão. Tente novamente.</div>'; go.disabled = false; go.textContent = 'Solicitar horário'; });

function showPix(r, s, when, wa, nm, ph){

function tokenOf(id){ var x = (mem().list || []).filter(function(y){ return y.id === id; })[0]; return x ? x.token : ''; }

  q('[data-sendrev]', function(el){ var x = one(el.dataset.sendrev), t = document.getElementById('rt_' + x.id); x._text = t ? t.value : ''; el.disabled = true; call({ action:'review', slug:SLUG, id:x.id, token:tokenOf(x.id), stars:x._stars, text:x._text }).then(function(r){ if (r.ok || /já avaliou/.test(r.error || '')) { x.reviewed = true; x._rev = false; x._err = ''; } else x._err = r.error || 'Não foi possível enviar.'; drawMine(); }).catch(function(){ x._err = 'Sem conexão.'; drawMine(); }); });
}

if (!SLUG) app.innerHTML = '<div class="card"><h2>Link incompleto</h2><p class="muted">Peça o link de agendamento ao estúdio.</p></div>';
else call({ action:'public_catalog', slug:SLUG }).then(function(r){ if (!r.ok) throw 0; cat = r.catalog; theme(cat.studio && cat.studio.theme); document.title = 'Agende · ' + cat.studio.name; if (Q.get('v') === 'meus' && (mem().list || []).length) loadMine(); else render(); }).catch(function(){ app.innerHTML = '<div class="card"><h2>Agendamento indisponível</h2><p class="muted">Este link não está ativo no momento. Fale com o estúdio pelo WhatsApp.</p></div>'; });
